<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-label="A reply in the chat panel exported as a vertical long image">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141922"/><stop offset="1" stop-color="#0c0f15"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2230"/><stop offset="1" stop-color="#12161e"/>
    </linearGradient>
  </defs>
  <rect width="640" height="300" fill="url(#bg)"/>

  <!-- chat panel -->
  <rect x="40" y="48" width="248" height="196" rx="14" fill="#131922" stroke="#2a3344"/>
  <rect x="40" y="48" width="248" height="34" rx="14" fill="#1a2230"/>
  <circle cx="60" cy="65" r="5" fill="#7fb2de"/>
  <rect x="74" y="61" width="80" height="7" rx="3.5" fill="#3a4658"/>
  <rect x="252" y="57" width="24" height="14" rx="7" fill="#2a4a6b"/>
  <rect x="256" y="62" width="16" height="4" rx="2" fill="#9fc4e4"/>

  <g fill="#2f3a4d">
    <rect x="58" y="100" width="150" height="8" rx="4"/>
    <rect x="58" y="116" width="190" height="8" rx="4"/>
    <rect x="58" y="132" width="120" height="8" rx="4"/>
  </g>
  <rect x="58" y="156" width="212" height="46" rx="8" fill="#0f1319"/>
  <g fill="#3f4f66">
    <rect x="70" y="168" width="90" height="6" rx="3"/>
    <rect x="70" y="182" width="150" height="6" rx="3"/>
  </g>

  <!-- arrow / export -->
  <path d="M312 146 h44" stroke="#7fb2de" stroke-width="3" stroke-linecap="round"/>
  <path d="M350 136 l14 10 -14 10" fill="none" stroke="#7fb2de" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- long image result -->
  <rect x="376" y="34" width="150" height="232" rx="14" fill="url(#card)" stroke="#2f4a66"/>
  <rect x="390" y="20" width="6" height="24" rx="3" fill="#f2c14e"/>
  <rect x="406" y="22" width="92" height="9" rx="4.5" fill="#e8ecf2"/>
  <rect x="406" y="38" width="60" height="6" rx="3" fill="#6b7482"/>

  <g fill="#39465a">
    <rect x="392" y="62" width="118" height="6" rx="3"/>
    <rect x="392" y="76" width="100" height="6" rx="3"/>
  </g>
  <rect x="392" y="94" width="118" height="34" rx="7" fill="#0d1117"/>
  <g fill="#4a6280">
    <rect x="402" y="104" width="70" height="5" rx="2.5"/>
    <rect x="402" y="115" width="94" height="5" rx="2.5"/>
  </g>
  <g fill="#39465a">
    <rect x="392" y="142" width="118" height="6" rx="3"/>
    <rect x="392" y="156" width="86" height="6" rx="3"/>
    <rect x="392" y="170" width="104" height="6" rx="3"/>
  </g>
  <rect x="392" y="196" width="118" height="1" fill="#242c39"/>
  <rect x="392" y="210" width="80" height="6" rx="3" fill="#5a657a"/>

  <!-- copy + download chips -->
  <g>
    <rect x="536" y="206" width="76" height="28" rx="14" fill="#16212f" stroke="#2f4a66"/>
    <rect x="550" y="215" width="16" height="12" rx="2" fill="none" stroke="#9fc4e4" stroke-width="2"/>
    <rect x="556" y="211" width="16" height="12" rx="2" fill="none" stroke="#9fc4e4" stroke-width="2"/>
  </g>
  <g>
    <rect x="536" y="242" width="76" height="28" rx="14" fill="#7fb2de"/>
    <path d="M566 250 v10" stroke="#0f1115" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M560 257 l6 7 6-7" fill="none" stroke="#0f1115" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
